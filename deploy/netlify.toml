# Netlify configuration for the Operit2 Web Access static bundle.
# The threaded Sherpa ONNX WebAssembly runtime requires cross-origin
# isolation headers on every application asset response.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

# Long-cache immutable build assets; Flutter emits content-hashed names.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
